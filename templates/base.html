<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# The block below is a slot. Each page can fill in its own title. #}
  <title>{% block title %}Project Blueprint{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- url_for builds the correct path to a file in /static -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header class="nav">
    <div class="container nav-inner">
      <a class="logo" href="{{ url_for('home') }}">Project <span>Blueprint</span></a>
      <nav>
        <a href="{{ url_for('mentor_list') }}">Find a mentor</a>
        <a href="{{ url_for('safety') }}">How it stays safe</a>
      </nav>
    </div>
  </header>

  <!-- Every page's unique content gets dropped in here -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container">Project Blueprint · This Is My Demo version · Atlanta, GA</div>
  </footer>

</body>
</html>
